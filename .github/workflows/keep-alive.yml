name: Keep Backend Alive (Render Cold-Start Preventer)

on:
  schedule:
    # Run every 10 minutes (UTC) in GitHub Cloud (Runs 24/7 without keeping your PC on)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Sending keep-alive ping to https://pesneer.onrender.com/api/health..."
          HTTP_HEALTH=$(curl -s -o response_health.json -w "%{http_code}" --max-time 45 https://pesneer.onrender.com/api/health || echo "000")
          echo "Health HTTP Status: $HTTP_HEALTH"
          if [ -f response_health.json ]; then
            echo "Health Response: $(cat response_health.json)"
          fi

      - name: Ping Root Endpoint
        run: |
          echo "Sending keep-alive ping to root https://pesneer.onrender.com..."
          HTTP_ROOT=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://pesneer.onrender.com || echo "000")
          echo "Root HTTP Status: $HTTP_ROOT"
          if [ "$HTTP_ROOT" -eq 200 ] || [ "$HTTP_ROOT" -eq 301 ] || [ "$HTTP_ROOT" -eq 302 ]; then
            echo "Root is alive and responding!"
          else
            echo "Warning: Root response code was $HTTP_ROOT"
          fi
