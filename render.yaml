services:
  - type: web
    name: pesneer
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: pesneer-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      - key: BootstrapOwner__Email
        value: sahip@mail.com
      - key: BootstrapOwner__Password
        sync: false
      - key: BootstrapOwner__CompanyCode
        value: TURA-ANKARA
      - key: BootstrapOwner__CompanyName
        value: Tura Çevre Sağlığı
      - key: SystemAdmin__Email
        value: sahip@mail.com
      - key: Email__Enabled
        value: "true"
      - key: Email__Provider
        value: Auto
      - key: Email__ApiBaseUrl
        value: https://api.resend.com
      - key: Email__ApiKey
        sync: false
      - key: Email__Host
        sync: false
      - key: Email__Port
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: Pestneer Raporlama
      - key: Email__EnableSsl
        value: "true"
      - key: Email__PublicBaseUrl
        value: https://pesneer.onrender.com
      - key: Email__FrontendBaseUrl
        value: https://pestneer-ctf.pages.dev
      - key: Cors__AllowedOrigins__0
        value: https://pestneer-ctf.pages.dev
      - key: Email__GoogleClientId
        sync: false
      - key: Email__GoogleClientSecret
        sync: false

databases:
  - name: pesneer-db
    plan: free
    region: frankfurt
    databaseName: pesneer
    user: pesneer
    postgresMajorVersion: "17"
